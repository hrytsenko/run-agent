name: Test Codex

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test-codex:
    name: Test Codex
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: '3.11'
      - run: |
          uv tool install .
          uv tool dir --bin >> "$GITHUB_PATH"
      - run: npm install --global @openai/codex@latest # zizmor: ignore[adhoc-packages] test the latest release
      - run: |
          {
            echo "- $(run-agent --version)"
            echo "- $(codex --version)"
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - timeout-minutes: 10
        env:
          CODEX_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MODEL: ${{ vars.OPENAI_MODEL }}
          EFFORT: ${{ vars.OPENAI_EFFORT }}
        run: |
          mkdir "$RUNNER_TEMP/workspace"
          cd "$RUNNER_TEMP/workspace"
          # The agent must run the script: it can't compute the token by itself.
          nonce=$(openssl rand -hex 8)
          printf 'import hashlib\nopen("token.txt", "w").write(hashlib.sha256(b"%s").hexdigest())\n' "$nonce" > make_token.py
          run-agent codex ${MODEL:+--model "$MODEL"} ${EFFORT:+--effort "$EFFORT"} "Run python3 make_token.py."
          test "$(cat token.txt)" = "$(printf '%s' "$nonce" | sha256sum | cut -d ' ' -f 1)"
